<circle cx="40" cy="835" r="7" fill="#2f3b52" stroke="black"/><text x="55" y="839" font-size="12.5">нижняя булавка набора A (цвет A) — линии L1,L3,L5,L7; s = 40 мм = 1/3 Q над экватором</text>
<circle cx="40" cy="857" r="7" fill="#c8102e" stroke="black"/><text x="55" y="861" font-size="12.5">нижняя булавка набора B (цвет B) — линии L0,L2,L4,L6</text>
<circle cx="40" cy="879" r="3.2" fill="#2f3b52"/><circle cx="50" cy="879" r="3.2" fill="#c8102e"/><text x="60" y="883" font-size="12.5">верхние точки (5 мм от NP): A — чётные линии, B — нечётные (TK-GT14). Пунктир: s = 5 и s = 40 мм</text>
