<text x="657" y="335" font-size="12">= «just to the left» по ходу; s = 5 мм от NP (TK-GT14)</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="black"/></marker></defs>
