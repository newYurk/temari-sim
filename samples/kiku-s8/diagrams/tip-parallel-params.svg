<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
<rect width="980" height="720" fill="white"/>
<text x="24" y="36" font-size="18" fill="#222" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Кику у кончика: перекрест обязателен; ряды почти параллельны снаружи</text>
<text x="24" y="58" font-size="13" fill="#444" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">① приход → ② стежок E→X под разметкой → ③ уход ПОВЕРХ прихода (chidori). Ряд 2 — та же анатомия, лента снаружи.</text>
<rect x="44" y="84" width="412" height="512" rx="10" fill="#fafafa" stroke="#ddd"/>
<text x="250.0" y="108" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Ряд 1 + ряд 2</text>
<text x="250.0" y="128" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif"> packing = вплотную</text>
<line x1="250.0" y1="135.0" x2="250.0" y2="437.0" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>
<text x="258.0" y="148" font-size="12" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">L</text>
<line x1="198.5" y1="150.0" x2="266.0" y2="360.0" stroke="#7b5ea7" stroke-width="3.4" stroke-linecap="round"/>
<line x1="266.0" y1="360.0" x2="234.0" y2="360.0" stroke="#7b5ea7" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7,5"/>
<line x1="234.0" y1="360.0" x2="301.5" y2="150.0" stroke="#7b5ea7" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="266.0" cy="360.0" r="4" stroke="#7b5ea7" fill="#7b5ea7" stroke-width="1"/>
<circle cx="234.0" cy="360.0" r="4" stroke="#7b5ea7" fill="#7b5ea7" stroke-width="1"/>
<text x="272.0" y="364" font-size="12" fill="#7b5ea7" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">E</text>
<text x="218.0" y="364" font-size="12" fill="#7b5ea7" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">X</text>
<circle cx="250.0" cy="310.2" r="9" stroke="#c0392b" fill="none" stroke-width="2.5"/>
<circle cx="250.0" cy="310.2" r="3" stroke="#c0392b" fill="#c0392b" stroke-width="1"/>
<text x="264.0" y="304.22222222222223" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">перекрест</text>
<text x="264.0" y="320.22222222222223" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">уход ПОВЕРХ</text>
<text x="242.25" y="255.0" font-size="11" fill="#7b5ea7" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">① приход</text>
<text x="250.0" y="378" font-size="11" fill="#7b5ea7" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">② E→X под L</text>
<text x="257.75" y="255.0" font-size="11" fill="#7b5ea7" text-anchor="end" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">③ уход</text>
<line x1="195.4" y1="150.0" x2="270.0" y2="382.0" stroke="#d46a9a" stroke-width="3.2" stroke-linecap="round"/>
<line x1="270.0" y1="382.0" x2="230.0" y2="382.0" stroke="#d46a9a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7,5"/>
<line x1="230.0" y1="382.0" x2="304.6" y2="150.0" stroke="#d46a9a" stroke-width="3.2" stroke-linecap="round"/>
<circle cx="270.0" cy="382.0" r="3.5" stroke="#d46a9a" fill="#d46a9a" stroke-width="1"/>
<circle cx="230.0" cy="382.0" r="3.5" stroke="#d46a9a" fill="#d46a9a" stroke-width="1"/>
<text x="274.96" y="396" font-size="11" fill="#d46a9a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">E₂</text>
<text x="212.04" y="396" font-size="11" fill="#d46a9a" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">X₂</text>
<circle cx="250.0" cy="319.9" r="7" stroke="#e74c3c" fill="none" stroke-width="1.8"/>
<line x1="272.0" y1="360.0" x2="272.0" y2="382.0" stroke="#1e8449" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="272.0" cy="360.0" r="2.5" stroke="#1e8449" fill="#1e8449" stroke-width="2"/>
<circle cx="272.0" cy="382.0" r="2.5" stroke="#1e8449" fill="#1e8449" stroke-width="2"/>
<text x="280.0" y="375.0" font-size="13" fill="#1e8449" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Δ</text>
<text x="305.0" y="255.0" font-size="10" fill="#6c3483" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">снаружи</text>
<rect x="500" y="120" width="440" height="110" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/>
<text x="520" y="150" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Без перекреста схема неверна</text>
<text x="520" y="175" font-size="13" fill="#641e16" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Уход всегда пересекает приход сверху у кончика.</text>
<text x="520" y="198" font-size="13" fill="#641e16" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Стежок — это E→X, не «точка схода» двух плеч.</text>
<rect x="500" y="250" width="440" height="130" rx="8" fill="#eafaf1" stroke="#1e8449"/>
<text x="520" y="280" font-size="15" fill="#1e8449" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Что свободно</text>
<text x="520" y="305" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• packing: зазор / вплотную / нахлёст</text>
<text x="520" y="328" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• форма плеча: прямое / ближе к L</text>
<text x="520" y="351" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">• ширина и глубина прокола (отдельно)</text>
<rect x="500" y="400" width="440" height="110" rx="8" fill="#eef2f7" stroke="#5d6d7e"/>
<text x="520" y="430" font-size="15" fill="#5d6d7e" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Что следствие</text>
<text x="520" y="455" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Δ на разметке (≈2 мм или ≈5 мм) — не режим,</text>
<text x="520" y="478" font-size="13" fill="#222" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">а результат packing + формы плеча.</text>
<text x="40" y="680" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Сирень = ряд 1, розовый = ряд 2 снаружи. Красный кружок = перекрест (уход поверх). Пунктир = канал под L.</text>
</svg>